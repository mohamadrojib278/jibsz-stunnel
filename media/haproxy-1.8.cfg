global
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 1d

    tune.bufsize 65536
    tune.maxrewrite 3072
    tune.ssl.default-dh-param 2048

    chroot /var/lib/haproxy

    user haproxy
    group haproxy

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option dontlognull
    option tcp-smart-connect
    timeout connect 5s
    timeout client  24h
    timeout server  24h

frontend main_port_443_listener
    mode tcp
    bind *:443 tfo
    bind *:8443 tfo
    bind *:2087 tfo
    bind *:2096 tfo
    tcp-request inspect-delay 500ms
    acl is_ssh payload(0,7) -m bin 5353482d322e30
    acl is_ssl req.ssl_hello_type 1
    tcp-request content accept if is_ssh
    tcp-request content accept if is_ssl
    tcp-request content accept if HTTP
    use_backend dropbear_backend if is_ssh
    use_backend plain_http_handler if HTTP
    default_backend https_traffic_handler

backend https_traffic_handler
    mode tcp
    server https_processor abns@ssl-processor send-proxy-v2 check

backend plain_http_handler
    mode tcp
    server plain_http 127.0.0.1:80 check

frontend plain_port_80_listener
    mode tcp
    bind *:80 tfo
    bind *:55 tfo
    bind *:8880 tfo
    bind *:2082 tfo
    bind *:8080 tfo
    tcp-request inspect-delay 500ms
    acl is_ssh payload(0,7) -m bin 5353482d322e30
    tcp-request content accept if is_ssh
    tcp-request content accept if HTTP
    use_backend dropbear_backend if is_ssh
    default_backend nginx_ws_handler

frontend ssl_traffic_processor
    mode tcp
    bind abns@ssl-processor accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content capture req.ssl_sni len 100
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_http2_protocol ssl_fc_alpn -i h2
    acl is_slowdns_traffic payload(0,7) -m bin 5353482d322e30

    use_backend grpc_protocol_handler if is_http2_protocol
    use_backend dropbear_backend if is_slowdns_traffic
    default_backend nginx_ws_handler

backend dropbear_backend
    mode tcp
    server dropbear_main 127.0.0.1:109 check

backend nginx_ws_handler
    mode tcp
    server websocket_server 127.0.0.1:1010 send-proxy check

backend grpc_protocol_handler
    mode tcp
    server grpc_server 127.0.0.1:1013 send-proxy check
